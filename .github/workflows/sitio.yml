name: Sitio

# Publica la landing de site/ en GitHub Pages (origen "GitHub Actions" en la configuración del
# repositorio). Es estática y autocontenida: no hay paso de build, se sube la carpeta tal cual.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/sitio.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  subir:
    name: Empaquetar site/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publicar:
    name: Publicar en GitHub Pages
    needs: subir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
