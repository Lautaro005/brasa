[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lautaro005/brasa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
brasa-core = { path = "crates/core" }
brasa-metal = { path = "crates/metal" }
brasa-kernels = { path = "crates/kernels" }
brasa-quant = { path = "crates/quant" }
brasa-tokenizer = { path = "crates/tokenizer" }
brasa-models = { path = "crates/models" }
brasa-memory = { path = "crates/memory" }
brasa-tuner = { path = "crates/tuner" }
brasa-runtime = { path = "crates/runtime" }
brasa-catalog = { path = "crates/catalog" }
brasa-bench = { path = "crates/bench" }
brasa-daemon = { path = "crates/daemon" }
brasa-cli = { path = "crates/cli" }

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
fancy-regex = "0.19"
unicode-normalization = "0.1"
minijinja = { version = "2.24", features = ["loop_controls", "preserve_order", "json"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"] }
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
